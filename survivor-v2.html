<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>サバイバー v2（試作）</title>
<style>
  html, body { margin: 0; height: 100%; background: #12161a; color: #e8efe9; overflow: hidden; touch-action: none;
               font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; }
  canvas { display: block; position: fixed; inset: 0; }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: safe center;
             gap: 12px; background: rgba(8,12,14,0.9); text-align: center; padding: 16px; box-sizing: border-box; overflow-y: auto; }
  .overlay > * { flex-shrink: 0; }
  .overlay.show { display: flex; }
  h1 { margin: 0; font-size: 32px; color: #ffd75e; }
  h2 { margin: 4px 0 0; font-size: 16px; color: #b8c4bc; font-weight: 600; }
  .sub { color: #b8c4bc; font-size: 14px; max-width: 560px; line-height: 1.6; white-space: pre-line; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .card { width: 168px; padding: 10px 8px; border-radius: 10px; border: 3px solid #5b7080; background: #25343a; color: #e8efe9;
          font-size: 13px; cursor: pointer; line-height: 1.45; }
  .card:hover { background: #2f4249; transform: translateY(-2px); }
  .card .ic { font-size: 36px; line-height: 1.2; }
  .card .nm { font-size: 15px; font-weight: 700; margin: 2px 0 4px; }
  .card .ds { color: #c8d3cc; font-size: 12px; }
  .card.new { border-color: #ffd75e; }
  .card.fusion { border-color: #ff7ad0; box-shadow: 0 0 16px #ff7ad0aa; background: #3a2540; }
  .card.sel { border-color: #7fd36b; box-shadow: 0 0 10px #7fd36b88; }
  .card.lock { opacity: 0.45; cursor: not-allowed; }
  .card.poor { opacity: 0.6; }
  button.big { font-size: 18px; padding: 10px 26px; border: 0; border-radius: 8px; background: #e0b341; color: #1f2a2e; cursor: pointer; }
  button.big.sub2 { background: #3b4a50; color: #e8efe9; font-size: 15px; padding: 8px 18px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay show">
  <h1>🧛 サバイバー v2</h1>
  <div class="sub" id="coins"></div>
  <button class="big sub2" id="shopBtn">🛒 強化ショップ</button>
  <h2>① キャラを選ぶ</h2>
  <div class="row" id="chars"></div>
  <h2>② ステージを選ぶ（クリアすると次が解放）</h2>
  <div class="row" id="stages"></div>
  <button class="big" id="goBtn">出発！</button>
  <div class="sub">移動：WASD / 矢印キー（スマホ・マウスは画面をドラッグ）。攻撃は自動。M キーで音の ON/OFF。
クリア後は死神が現れます。X キーで脱出できます。</div>
</div>

<div id="shop" class="overlay">
  <h1>🛒 強化ショップ</h1>
  <div class="sub" id="shopCoins"></div>
  <div class="row" id="shopItems"></div>
  <button class="big" id="shopClose">もどる</button>
</div>

<div id="levelup" class="overlay">
  <h1 id="luTitle">LEVEL UP！</h1>
  <div class="row" id="luCards"></div>
</div>

<div id="endview" class="overlay">
  <h1 id="endTitle"></h1>
  <div class="sub" id="endBody"></div>
  <button class="big" id="endBtn">メニューへ</button>
</div>

<script>
// =====================================================
//  設定（ここをいじるとバランスが変わります）
// =====================================================
const AUTO_PICK_SECONDS = 3;   // レベルアップの選択の制限時間（過ぎたらランダムに選ばれる。0 で無効）
const MAX_ENEMIES = 500;        // 同時に出る敵の上限
const MAX_WEAPONS = 8;          // 持てる武器の数
const MAX_PASSIVES = 8;         // 持てるアイテムの数
const FOOD_HEAL = 50;           // 肉で回復するHP
const FOOD_EVERY = [40, 38];    // 肉が出る間隔（秒）の最小・最大
const FOOD_MAX = 3;             // 同時に落ちている肉の数
const REAPER_AT = 0.8;          // 制限時間のこの割合で、中ボスの死神が出る
const GRIM_ACCEL = 2.0;         // クリア後の「大死神」が、1秒ごとに速くなる量

// ---- アイコン ----
// 絵文字の代わりに自作の画像を使えます。icons フォルダに PNG を置くと自動で使われます。
// ファイル名の例：char_knight.png / enemy_bat.png / weapon_wand.png
const ICON_DIR = 'icons/';
const iconCache = {};
const iconFailed = {};
function iconImage(key) {
  if (typeof Image === 'undefined' || iconFailed[key]) return null;
  let img = iconCache[key];
  if (!img) {
    img = new Image();
    img.onerror = () => { iconFailed[key] = true; };
    img.src = ICON_DIR + key.replace(':', '_') + '.png';
    iconCache[key] = img;
  }
  return (img.complete && img.naturalWidth > 0) ? img : null;
}

// =====================================================
//  データ：キャラ・武器・合体技・アイテム・敵・ステージ・ショップ
// =====================================================
const CHARACTERS = [
  { id: 'knight', name: '騎士アルト', icon: '🛡️', hp: 200, speed: 140, weapon: 'knife', desc: 'HPが高い。\n最初の武器：ナイフ' },
  { id: 'mage',   name: '魔女ミラ',   icon: '🧙', hp: 90,  speed: 150, weapon: 'wand', cdMul: 0.85, desc: '攻撃の間隔が短い。\n最初の武器：魔法の杖' },
  { id: 'monk',   name: '僧侶ホリィ', icon: '👼', hp: 110, speed: 145, weapon: 'garlic', regen: 0.6, desc: 'HPが少しずつ回復する。\n最初の武器：ニンニク' },
];

// locked: ショップで解放すると、レベルアップの候補に出る / cost: 解放の費用（コイン）
const WEAPONS = {
  wand:     { name: '魔法の杖', icon: '🪄', max: 5, desc: '近くの敵に魔法の弾を撃つ' },
  knife:    { name: 'ナイフ',   icon: '🗡️', max: 5, desc: '近くの敵に向かって飛ぶ。貫通する' },
  orbit:    { name: '聖なる書', icon: '📖', max: 5, desc: '自分の周りを光が回る' },
  garlic:   { name: 'ニンニク', icon: '🧄', max: 5, desc: '周りの敵に継続ダメージ' },
  bolt:     { name: '稲妻',     icon: '⚡', max: 5, desc: '画面内の敵にランダムで落雷' },
  axe:      { name: '斧',       icon: '🪓', max: 5, desc: '上に投げて弧を描く。貫通する' },
  fireball: { name: '火の玉',   icon: '🔥', max: 5, desc: '当たると爆発して、周りの敵も巻き込む', locked: true, cost: 300 },
  frost:    { name: '氷の矢',   icon: '❄️', max: 5, desc: '扇状に飛ぶ。当たった敵を遅くする',       locked: true, cost: 400 },
  bow:      { name: '弓',       icon: '🏹', max: 5, desc: '速い矢をまとめて連射する',               locked: true, cost: 500 },
  cross:    { name: '十字架',   icon: '✝️', max: 5, desc: '飛んでいって戻ってくる。貫通する',       locked: true, cost: 600 },
};

// 合体技：a と b の両方がレベルMAXのとき、レベルアップの候補に出る。選ぶと2つが1つの強力な武器になる
const FUSIONS = {
  thunder:   { name: '雷帝の杖',   icon: '🌩️', a: 'wand',     b: 'bolt',   desc: '3体に大きな雷を落とし、周りの敵にも連鎖する' },
  blades:    { name: '千刃乱舞',   icon: '🌀', a: 'knife',    b: 'axe',    desc: '全方向に12本の刃を放つ' },
  sanctuary: { name: '聖域',       icon: '⛪', a: 'orbit',    b: 'garlic', desc: '広い光のオーラと光球。触れた敵を焼き、HPも回復する' },
  firefrost: { name: '氷炎の嵐',   icon: '☄️', a: 'fireball', b: 'frost',  desc: '炎と氷の爆発を全方向にばらまく' },
  holyrain:  { name: '聖なる矢雨', icon: '🌧️', a: 'bow',      b: 'cross',  desc: '空から聖なる矢が敵に降り注ぐ' },
};
function wdef(id) { return WEAPONS[id] || FUSIONS[id]; }

// 武器のレベルごとの性能（L = 1〜5）
function wstat(id, L) {
  switch (id) {
    case 'wand':     return { dmg: 10 + 4 * (L - 1), cd: Math.max(0.35, 1.2 - 0.15 * (L - 1)), n: 1 + Math.floor((L - 1) / 2) };
    case 'knife':    return { dmg: 6 + 3 * (L - 1),  cd: Math.max(0.4, 1.0 - 0.1 * (L - 1)),   n: 1 + Math.floor(L / 2) };
    case 'orbit':    return { dmg: 6 + 2 * (L - 1),  cd: 0,                                      n: 1 + Math.ceil(L / 2), rad: 70 + 5 * L };
    case 'garlic':   return { dmg: 4 + 2 * (L - 1),  cd: 0.5,                                    rad: 55 + 9 * L };
    case 'bolt':     return { dmg: 25 + 8 * (L - 1), cd: Math.max(0.7, 1.8 - 0.2 * (L - 1)),   n: 1 + Math.floor(L / 2), rad: 45 };
    case 'axe':      return { dmg: 14 + 5 * (L - 1), cd: Math.max(0.6, 1.6 - 0.15 * (L - 1)),  n: 1 + Math.floor((L - 1) / 2) };
    case 'fireball': return { dmg: 14 + 6 * (L - 1), cd: Math.max(0.8, 1.6 - 0.15 * (L - 1)),  n: 1 + Math.floor((L - 1) / 2), rad: 55 };
    case 'frost':    return { dmg: 9 + 3 * (L - 1),  cd: Math.max(0.8, 1.5 - 0.12 * (L - 1)),  n: 2 + Math.floor(L / 2) };
    case 'bow':      return { dmg: 9 + 3 * (L - 1),  cd: Math.max(0.5, 1.1 - 0.1 * (L - 1)),   n: 2 + Math.floor(L / 2) };
    case 'cross':    return { dmg: 12 + 4 * (L - 1), cd: Math.max(0.9, 2.0 - 0.2 * (L - 1)),   n: 1 + Math.floor((L - 1) / 2) };
    // 合体技（レベルなし）
    case 'thunder':   return { dmg: 60, cd: 0.55, n: 3, rad: 60 };
    case 'blades':    return { dmg: 32, cd: 0.9,  n: 12 };
    case 'sanctuary': return { dmg: 24, cd: 0.4,  n: 5, rad: 110, aura: 130, auraDmg: 12 };
    case 'firefrost': return { dmg: 38, cd: 1.0,  n: 8, rad: 55 };
    case 'holyrain':  return { dmg: 40, cd: 0.6,  n: 5, rad: 40 };
  }
}
function describe(id, L) {
  const s = wstat(id, L);
  return 'ダメージ ' + s.dmg + (s.n ? '／数 ' + s.n : '') + (s.cd ? '／間隔 ' + s.cd.toFixed(1) + '秒' : '') + (s.rad && id !== 'bolt' ? '／範囲 ' + s.rad : '');
}

const PASSIVES = {
  might:  { name: '力の指輪',   icon: '💍', max: 5, desc: '攻撃力 +15%' },
  clock:  { name: '懐中時計',   icon: '🕰️', max: 5, desc: '武器の間隔 -8%' },
  boots:  { name: '韋駄天の靴', icon: '👢', max: 5, desc: '移動速度 +10%' },
  heart:  { name: 'ハート',     icon: '❤️', max: 5, desc: '最大HP +20（回復も）' },
  magnet: { name: '磁石',       icon: '🧲', max: 5, desc: '宝石を引き寄せる範囲 +30%' },
  herb:   { name: '薬草',       icon: '🌿', max: 5, desc: 'HPの回復 +0.3/秒' },
};

// from: 出始める秒数 / elite: エリート（一定間隔で出る） / shoot: 弾を撃つ / xp: 倒したときの宝石の経験値
// 宝石の色：1=青 / 5〜=緑 / 25〜=赤 / 100〜=紫（強い敵ほど高い）
const ENEMIES = {
  bat:       { name: 'コウモリ',   icon: '🦇', hp: 5,    speed: 95,  dmg: 3,  r: 11, xp: 1,   from: 0 },
  zombie:    { name: 'ゾンビ',     icon: '🧟', hp: 18,   speed: 55,  dmg: 6,  r: 15, xp: 2,   from: 20 },
  wolf:      { name: '狼',         icon: '🐺', hp: 10,   speed: 125, dmg: 5,  r: 13, xp: 2,   from: 30 },
  skel:      { name: 'スケルトン', icon: '💀', hp: 30,   speed: 70,  dmg: 8,  r: 14, xp: 3,   from: 60 },
  ghost:     { name: 'ゴースト',   icon: '👻', hp: 22,   speed: 88,  dmg: 7,  r: 14, xp: 3,   from: 90 },
  vampire:   { name: '吸血鬼',     icon: '🧛', hp: 60,   speed: 80,  dmg: 10, r: 15, xp: 6,   from: 120 },
  golem:     { name: 'ゴーレム',   icon: '🗿', hp: 140,  speed: 40,  dmg: 14, r: 24, xp: 12,  from: 150 },
  ogre:      { name: 'オーガ',     icon: '👹', hp: 220,  speed: 46,  dmg: 18, r: 26, xp: 25,  elite: { start: 120, every: 40 } },
  majin:     { name: '魔人',       icon: '🧞', hp: 350,  speed: 55,  dmg: 15, r: 24, xp: 60,  elite: { start: 150, every: 55 }, shoot: { every: 2.6, speed: 190, dmg: 12, n: 1 } },
  shinigami: { name: '死神',       icon: '☠️', hp: 420,  speed: 82,  dmg: 25, r: 24, xp: 120, elite: { start: 210, every: 75 } },
  dragon:    { name: '竜',         icon: '🐉', hp: 900,  speed: 60,  dmg: 30, r: 34, xp: 150, elite: { start: 240, every: 80 }, shoot: { every: 3, speed: 180, dmg: 14, n: 3 } },
  reaper:    { name: '大鎌の死神', icon: '🧛‍♂️', hp: 1500, speed: 62,  dmg: 35, r: 34, xp: 300, boss: true },
  grim:      { name: '大死神',     icon: '☠️', hp: 1e12, speed: 110, dmg: 99999, r: 46, xp: 0, boss: true, grim: true },
};

// time: クリアまでの秒数 / hp, rate, dmg: 敵の硬さ・出現の多さ・攻撃力の倍率 / pool: 出てくる敵
const STAGES = [
  { name: '暗い森',       time: 300, hp: 1,   rate: 1,    dmg: 1,   bg: ['#27402b', '#2b452f'], deco: ['🌿', '🌼', '🍄', '🪨'],
    pool: ['bat', 'zombie', 'wolf', 'skel', 'ghost', 'ogre'] },
  { name: '月夜の墓地',   time: 360, hp: 1.3, rate: 1.15, dmg: 1.1, bg: ['#262838', '#2a2c3d'], deco: ['🪦', '💀', '🕯️', '🌫️'],
    pool: ['bat', 'zombie', 'wolf', 'skel', 'ghost', 'vampire', 'ogre', 'majin'] },
  { name: '呪われた古城', time: 420, hp: 1.7, rate: 1.3,  dmg: 1.2, bg: ['#3a2630', '#3e2a34'], deco: ['🕸️', '🕯️', '🦇', '⚔️'],
    pool: ['bat', 'wolf', 'skel', 'ghost', 'vampire', 'golem', 'ogre', 'majin', 'shinigami'] },
  { name: '魔界',         time: 480, hp: 2.2, rate: 1.5,  dmg: 1.35, bg: ['#401c1c', '#461f1f'], deco: ['🔥', '🌋', '👁️', '💀'],
    pool: ['bat', 'wolf', 'ghost', 'vampire', 'golem', 'ogre', 'majin', 'shinigami', 'dragon'] },
];

// ショップ：クリアやプレイで貯めたコインで買う、ずっと続く強化（lv: 現在のレベル）
const SHOP = [
  { id: 'hp',     name: '最大HPアップ',   icon: '❤️', max: 10, cost: lv => 80 + lv * 60,   desc: '最大HP +10%' },
  { id: 'atk',    name: '攻撃力アップ',   icon: '💪', max: 10, cost: lv => 100 + lv * 80,  desc: '攻撃力 +5%' },
  { id: 'spd',    name: '移動速度アップ', icon: '👟', max: 5,  cost: lv => 120 + lv * 100, desc: '移動速度 +3%' },
  { id: 'xp',     name: '経験値アップ',   icon: '📘', max: 10, cost: lv => 100 + lv * 70,  desc: '経験値 +5%' },
  { id: 'regen',  name: '自然回復',       icon: '🌿', max: 5,  cost: lv => 150 + lv * 120, desc: 'HPの回復 +0.1/秒' },
  { id: 'magnet', name: '磁石の範囲',     icon: '🧲', max: 5,  cost: lv => 100 + lv * 90,  desc: '宝石の吸引 +10%' },
  { id: 'start',  name: '初期武器を追加', icon: '🎁', max: 2,  cost: lv => 600 + lv * 1200, desc: '開始時に、解放済みの武器をランダムでもう1つ持つ' },
  { id: 'revive', name: '復活',           icon: '✨', max: 2,  cost: lv => 800 + lv * 1500, desc: '倒されても、HP半分で1回よみがえる' },
];

// =====================================================
//  保存（コインや強化は、ブラウザに残る）
// =====================================================
const META_KEY = 'sv_meta2';
function defaultMeta() { return { coins: 0, lv: {}, weapons: {}, cleared: {}, best: {} }; }
function loadMeta() {
  try { return Object.assign(defaultMeta(), JSON.parse(localStorage.getItem(META_KEY) || '{}')); } catch (e) { return defaultMeta(); }
}
function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) { /* 保存できなくても続行 */ } }
let meta = loadMeta();
const mlv = id => meta.lv[id] || 0;
const weaponUnlocked = id => !WEAPONS[id].locked || !!meta.weapons[id];

// =====================================================
//  画面・入力
// =====================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 800, VH = 600;
function resize() {
  VW = window.innerWidth || 800;
  VH = window.innerHeight || 600;
  canvas.width = VW;
  canvas.height = VH;
}
window.addEventListener('resize', resize);
resize();

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'm') toggleSound();
  if (e.key.toLowerCase() === 'x' && mode === 'play' && stageCleared) endGame();   // クリア後は脱出できる
  initAudio();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const joy = { active: false, ox: 0, oy: 0, x: 0, y: 0 };   // 画面のドラッグで動かす（スマホ・マウス）
canvas.addEventListener('pointerdown', e => { joy.active = true; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; initAudio(); });
canvas.addEventListener('pointermove', e => { if (joy.active) { joy.x = e.clientX; joy.y = e.clientY; } });
window.addEventListener('pointerup', () => { joy.active = false; });

function inputVector() {
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft']) x -= 1;
  if (keys['d'] || keys['arrowright']) x += 1;
  if (keys['w'] || keys['arrowup']) y -= 1;
  if (keys['s'] || keys['arrowdown']) y += 1;
  if (joy.active) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy;
    const d = Math.hypot(dx, dy);
    if (d > 8) { x = dx / Math.max(d, 60); y = dy / Math.max(d, 60); }
  }
  const l = Math.hypot(x, y);
  return l > 1 ? { x: x / l, y: y / l } : { x, y };
}

// =====================================================
//  ゲームの状態
// =====================================================
let mode = 'menu';          // 'menu' | 'play' | 'levelup' | 'end'
let P, S, stageIdx, enemies, gems, shots, eshots, foods, pops, fxs, grid, banner;
let T, kills, nextElite, reaperSpawned, spawnTimer, foodTimer, luTimer, pendingLevels, choices, stageCleared, grim;
const sel = { ch: 0, stage: 0 };

function startGame(ch, si) {
  S = STAGES[si];
  stageIdx = si;
  P = {
    ch, x: 0, y: 0, fx: 1, fy: 0,
    baseHp: ch.hp * (1 + 0.1 * mlv('hp')), hp: 0, maxHp: 0, baseSpeed: ch.speed, speed: ch.speed,
    level: 1, xp: 0, need: xpNeed(1), inv: 0, orbitAngle: 0,
    weapons: [{ id: ch.weapon, lv: 1, cd: 0.3 }], passives: {},
    might: 1, cdMul: 1, magnet: 90, regen: 0, xpMul: 1, revives: mlv('revive'),
  };
  P.hp = P.maxHp = P.baseHp;
  // 「初期武器を追加」：解放済みの武器からランダムに
  for (let i = 0; i < mlv('start'); i++) {
    const pool = Object.keys(WEAPONS).filter(id => weaponUnlocked(id) && !P.weapons.some(w => w.id === id));
    if (pool.length) P.weapons.push({ id: pool[Math.floor(Math.random() * pool.length)], lv: 1, cd: 0.3 });
  }
  recompute();
  enemies = []; gems = []; shots = []; eshots = []; foods = []; pops = []; fxs = [];
  T = 0; kills = 0; reaperSpawned = false; spawnTimer = 0.5; pendingLevels = 0; stageCleared = false; grim = null;
  foodTimer = 15 + Math.random() * 10;
  nextElite = {};
  for (const k of S.pool) if (ENEMIES[k].elite) nextElite[k] = ENEMIES[k].elite.start;
  banner = { text: S.name, sub: fmtTime(S.time) + ' 生き残れ！', t: 3 };
  mode = 'play';
  document.getElementById('menu').classList.remove('show');
  document.getElementById('endview').classList.remove('show');
}

function xpNeed(level) { return 3 + level * 8; }   // 次のレベルまでに必要な経験値

// アイテムとショップの効果を、レベルから計算し直す
function recompute() {
  const p = P.passives;
  P.might = (1 + 0.15 * (p.might || 0)) * (1 + 0.05 * mlv('atk'));
  P.cdMul = Math.max(0.5, 1 - 0.08 * (p.clock || 0)) * (P.ch.cdMul || 1);
  P.speed = P.baseSpeed * (1 + 0.1 * (p.boots || 0)) * (1 + 0.03 * mlv('spd'));
  const newMax = P.baseHp + 20 * (p.heart || 0);
  P.hp += newMax - P.maxHp;
  P.maxHp = newMax;
  P.magnet = 90 * (1 + 0.3 * (p.magnet || 0)) * (1 + 0.1 * mlv('magnet'));
  P.regen = (P.ch.regen || 0) + 0.3 * (p.herb || 0) + 0.1 * mlv('regen');
  P.xpMul = 1 + 0.05 * mlv('xp');
}

// =====================================================
//  敵の出現
// =====================================================
function ringPos() {
  const a = Math.random() * Math.PI * 2;
  const dist = Math.hypot(VW, VH) / 2 + 60;
  return { x: P.x + Math.cos(a) * dist, y: P.y + Math.sin(a) * dist };
}

function spawnEnemy(kind, atX, atY) {
  const d = ENEMIES[kind];
  const pos = atX === undefined ? ringPos() : { x: atX, y: atY };
  const hp = d.grim ? 1e12 : d.hp * (1 + T / 150) * S.hp;   // 時間とともに、ステージごとに硬くなる
  enemies.push({
    kind, x: pos.x, y: pos.y, hp, maxHp: hp,
    speed: d.speed * (d.grim ? 1 : 0.9 + Math.random() * 0.2), dmg: d.grim ? d.dmg : d.dmg * (1 + T / 400) * S.dmg, r: d.r,
    flash: 0, kx: 0, ky: 0, orbitCd: 0, dead: false, id: Math.random(), slowT: 0, shootCd: 1 + Math.random() * 2,
  });
  return enemies[enemies.length - 1];
}

function pickKind() {
  const list = [];
  for (const k of S.pool) {
    const d = ENEMIES[k];
    if (d.elite || d.boss || T < d.from) continue;
    list.push([k, k === 'bat' ? Math.max(1, 6 - T / 40) : (k === 'golem' ? 1.5 : 3)]);
  }
  let x = Math.random() * list.reduce((a, r) => a + r[1], 0);
  for (const r of list) { x -= r[1]; if (x < 0) return r[0]; }
  return 'bat';
}

function updateSpawns(dt) {
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = Math.max(0.12, (1.0 - T / 450) / S.rate);
    const n = 1 + Math.floor(T / 90);
    for (let i = 0; i < n && enemies.length < MAX_ENEMIES; i++) spawnEnemy(pickKind());
  }
  for (const k in nextElite) {   // エリートは一定間隔で出る
    if (T >= nextElite[k]) {
      spawnEnemy(k);
      nextElite[k] += ENEMIES[k].elite.every;
      popText(P.x, P.y - 40, '⚠ ' + ENEMIES[k].name + ' 出現！', '#ff9a5a');
    }
  }
  if (!reaperSpawned && T >= S.time * REAPER_AT && !stageCleared) {
    reaperSpawned = true;
    spawnEnemy('reaper');
    banner = { text: '⚠ 大鎌の死神', sub: '強敵が現れた！', t: 3 };
  }
}

// =====================================================
//  ダメージ・ドロップ
// =====================================================
function hurt(e, dmg, kx, ky) {
  if (e.dead) return;
  const d = Math.round(dmg * P.might);
  if (ENEMIES[e.kind].grim) { popText(e.x, e.y - e.r, 'キィン…', '#888'); return; }   // 大死神は倒せない
  e.hp -= d;
  e.flash = 0.08;
  if (pops.length < 90) popText(e.x, e.y - e.r, String(d), '#fff');
  if (!ENEMIES[e.kind].boss) { e.kx += (kx || 0) * 60; e.ky += (ky || 0) * 60; }
  sfxHit();
  if (e.hp <= 0) {
    e.dead = true;
    kills++;
    dropGem(e.x, e.y, ENEMIES[e.kind].xp);
  }
}

// 宝石を落とす（数が多すぎるときは、まとめて1つにする）
function dropGem(x, y, v) {
  if (gems.length > 500) { const g = gems.shift(); v += g.v; }
  gems.push({ x, y, v });
}

function popText(x, y, text, color) { pops.push({ x, y, text, color, t: 0.7 }); }

// =====================================================
//  武器
// =====================================================
function nearestEnemies(n, maxDist) {
  return enemies.filter(e => !e.dead && Math.hypot(e.x - P.x, e.y - P.y) < maxDist)
    .sort((a, b) => Math.hypot(a.x - P.x, a.y - P.y) - Math.hypot(b.x - P.x, b.y - P.y)).slice(0, n);
}
function inView(n) {   // 画面内の敵からランダムに n 体
  const view = enemies.filter(e => !e.dead && Math.abs(e.x - P.x) < VW / 2 && Math.abs(e.y - P.y) < VH / 2);
  const out = [];
  while (out.length < n && view.length) out.push(view.splice(Math.floor(Math.random() * view.length), 1)[0]);
  return out;
}
const aimAt = e => Math.atan2(e.y - P.y, e.x - P.x);

function addShot(o) { shots.push(Object.assign({ hit: new Set(), life: 1.5, r: 8, pierce: 1, g: 0, spin: 0, ang: 0, wid: 'wand' }, o)); }

// 爆発（火の玉など）。slow: 当たった敵を遅くする
function explode(x, y, rad, dmg, slow, color) {
  for (const e of nearCells(x, y, rad)) {
    if (e.dead || Math.hypot(e.x - x, e.y - y) >= rad + e.r) continue;
    hurt(e, dmg, (e.x - x) / 30, (e.y - y) / 30);
    if (slow) e.slowT = 1.5;
  }
  fxs.push({ kind: 'ring', x, y, r: rad, t: 0.2, max: 0.2, color: color || 'rgba(255,150,60,0.6)' });
}

function orbitTick(w, n, rad, dmg) {   // 周りを回る光
  w.orbs = [];
  for (let k = 0; k < n; k++) {
    const a = P.orbitAngle + k * Math.PI * 2 / n;
    const ox = P.x + Math.cos(a) * rad, oy = P.y + Math.sin(a) * rad;
    w.orbs.push({ x: ox, y: oy });
    for (const e of nearCells(ox, oy)) {
      if (e.dead || e.orbitCd > 0) continue;
      if (Math.hypot(e.x - ox, e.y - oy) < e.r + 12) { hurt(e, dmg, Math.cos(a), Math.sin(a)); e.orbitCd = 0.45; }
    }
  }
}
function auraTick(rad, dmg, color) {   // 自分の周りの敵に継続ダメージ
  for (const e of nearCells(P.x, P.y, rad)) {
    const d = Math.hypot(e.x - P.x, e.y - P.y);
    if (!e.dead && d < rad + e.r) hurt(e, dmg, (e.x - P.x) / (d || 1), (e.y - P.y) / (d || 1));
  }
  fxs.push({ kind: 'ring', x: P.x, y: P.y, r: rad, t: 0.15, max: 0.15, color: color || 'rgba(180,255,120,0.5)' });
}
function lightning(e, rad, dmg, color) {
  fxs.push({ kind: 'bolt', x: e.x, y: e.y, t: 0.18, max: 0.18, color });
  for (const o of nearCells(e.x, e.y, rad)) if (!o.dead && Math.hypot(o.x - e.x, o.y - e.y) < rad + o.r) hurt(o, dmg, 0, 0);
  sfxTone(900, 200, 0.12, 'sawtooth', 0.12);
}

function updateWeapons(dt) {
  P.orbitAngle += dt * 2.6;
  for (const w of P.weapons) {
    const s = wstat(w.id, w.lv);
    if (w.id === 'orbit') { orbitTick(w, s.n, s.rad, s.dmg); continue; }
    if (w.id === 'sanctuary') orbitTick(w, s.n, s.rad, s.dmg);
    w.cd -= dt;
    if (w.cd > 0) continue;
    const reset = () => { w.cd = s.cd * P.cdMul; };
    switch (w.id) {
      case 'garlic': reset(); auraTick(s.rad, s.dmg); break;
      case 'sanctuary': reset(); auraTick(s.aura, s.auraDmg, 'rgba(255,240,150,0.5)'); P.hp = Math.min(P.maxHp, P.hp + 1); break;
      case 'wand': {
        const ts = nearestEnemies(s.n, 520);
        if (!ts.length) { w.cd = 0.15; break; }
        reset();
        for (const e of ts) { const a = aimAt(e); addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 330, vy: Math.sin(a) * 330, dmg: s.dmg, life: 1.6, wid: 'wand', icon: '✨' }); }
        break;
      }
      case 'knife': {
        reset();
        const near = nearestEnemies(1, 420)[0];   // いちばん近い敵の方向（いなければ向いている方向）
        const base = near ? aimAt(near) : Math.atan2(P.fy, P.fx);
        for (let i = 0; i < s.n; i++) {
          const a = base + (i - (s.n - 1) / 2) * 0.2;
          addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 480, vy: Math.sin(a) * 480, dmg: s.dmg, life: 0.9, pierce: 3, wid: 'knife', icon: '🗡️', ang: a + Math.PI / 4 });
        }
        break;
      }
      case 'bolt': {
        const ts = inView(s.n);
        if (!ts.length) { w.cd = 0.2; break; }
        reset();
        for (const e of ts) lightning(e, s.rad, s.dmg);
        break;
      }
      case 'axe':
        reset();
        for (let i = 0; i < s.n; i++) {
          const dir = (P.fx >= 0 ? 1 : -1) * (i % 2 ? -1 : 1);
          addShot({ x: P.x, y: P.y, vx: dir * (70 + i * 25), vy: -320 - i * 30, g: 760, dmg: s.dmg, r: 14, life: 2.2, pierce: 99, wid: 'axe', icon: '🪓', spin: 9 });
        }
        break;
      case 'fireball': {
        const ts = nearestEnemies(s.n, 520);
        if (!ts.length) { w.cd = 0.15; break; }
        reset();
        for (const e of ts) { const a = aimAt(e); addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 270, vy: Math.sin(a) * 270, dmg: s.dmg, r: 10, life: 1.8, wid: 'fireball', icon: '🔥', boom: { rad: s.rad, dmg: s.dmg } }); }
        break;
      }
      case 'frost': {
        const near = nearestEnemies(1, 480)[0];
        if (!near) { w.cd = 0.15; break; }
        reset();
        const base = aimAt(near);
        for (let i = 0; i < s.n; i++) {
          const a = base + (i - (s.n - 1) / 2) * 0.22;
          addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 340, vy: Math.sin(a) * 340, dmg: s.dmg, life: 1.2, pierce: 2, wid: 'frost', icon: '❄️', slow: true });
        }
        break;
      }
      case 'bow': {
        const near = nearestEnemies(1, 520)[0];
        if (!near) { w.cd = 0.15; break; }
        reset();
        const base = aimAt(near);
        for (let i = 0; i < s.n; i++) {
          const a = base + (i - (s.n - 1) / 2) * 0.1;
          addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 650, vy: Math.sin(a) * 650, dmg: s.dmg, r: 7, life: 0.9, pierce: 2, wid: 'bow', icon: '🏹', ang: a + Math.PI / 4 });
        }
        break;
      }
      case 'cross': {
        const near = nearestEnemies(1, 520)[0];
        if (!near) { w.cd = 0.15; break; }
        reset();
        for (let i = 0; i < s.n; i++) {
          const a = aimAt(near) + (i - (s.n - 1) / 2) * 0.5;
          addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, dmg: s.dmg, r: 14, life: 2.4, pierce: 99, wid: 'cross', icon: '✝️', spin: 8, boom2: 0.55 });
        }
        break;
      }
      // ---- 合体技 ----
      case 'thunder': {
        const ts = inView(s.n);
        if (!ts.length) { w.cd = 0.2; break; }
        reset();
        for (const e of ts) {
          lightning(e, s.rad, s.dmg, '#9fe0ff');
          for (const o of nearCells(e.x, e.y, 150).filter(o => !o.dead && o !== e).slice(0, 2)) {   // 連鎖
            fxs.push({ kind: 'link', x: e.x, y: e.y, x2: o.x, y2: o.y, t: 0.15, max: 0.15 });
            hurt(o, s.dmg * 0.5, 0, 0);
          }
        }
        break;
      }
      case 'blades':
        reset();
        for (let i = 0; i < s.n; i++) {
          const a = i * Math.PI * 2 / s.n + P.orbitAngle;
          addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, dmg: s.dmg, r: 9, life: 1.1, pierce: 5, wid: 'knife', icon: '🗡️', ang: a + Math.PI / 4 });
        }
        break;
      case 'firefrost':
        reset();
        for (let i = 0; i < s.n; i++) {
          const a = i * Math.PI * 2 / s.n + P.orbitAngle;
          const fire = i % 2 === 0;
          addShot({ x: P.x, y: P.y, vx: Math.cos(a) * 250, vy: Math.sin(a) * 250, dmg: s.dmg, r: 10, life: 1.2, wid: fire ? 'fireball' : 'frost', icon: fire ? '🔥' : '❄️',
                    boom: { rad: s.rad, dmg: s.dmg, slow: !fire, color: fire ? undefined : 'rgba(120,200,255,0.6)' } });
        }
        break;
      case 'holyrain': {
        const ts = inView(s.n);
        if (!ts.length) { w.cd = 0.2; break; }
        reset();
        for (const e of ts) lightning(e, s.rad, s.dmg, '#ffe9a0');
        break;
      }
    }
  }
}

function updateShots(dt) {
  for (const p of shots) {
    p.vy += p.g * dt;
    if (p.boom2) {   // 十字架：しばらく進んだら、プレイヤーに向かって戻ってくる
      p.boom2 -= dt;
      if (p.boom2 <= 0 && !p.back) { p.back = true; p.hit.clear(); }
      if (p.back) {
        const dx = P.x - p.x, dy = P.y - p.y, d = Math.hypot(dx, dy) || 1;
        p.vx = dx / d * 380; p.vy = dy / d * 380;
        if (d < 20) p.life = 0;
      }
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.ang += p.spin * dt;
    for (const e of nearCells(p.x, p.y)) {
      if (e.dead || p.hit.has(e.id)) continue;
      if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r) {
        p.hit.add(e.id);
        const l = Math.hypot(p.vx, p.vy) || 1;
        hurt(e, p.dmg, p.vx / l, p.vy / l);
        if (p.slow) e.slowT = 1.5;
        p.pierce--;
        if (p.pierce <= 0) { p.life = 0; break; }
      }
    }
    if (p.life <= 0 && p.boom) { explode(p.x, p.y, p.boom.rad, p.boom.dmg, p.boom.slow, p.boom.color); p.boom = null; }   // 爆発する弾
  }
  shots = shots.filter(p => p.life > 0);
}

// 敵を 64px の格子に入れておき、近くの敵だけを調べる（敵が多くても軽い）
function buildGrid() {
  grid = new Map();
  for (const e of enemies) {
    const k = Math.floor(e.x / 64) * 100003 + Math.floor(e.y / 64);
    const a = grid.get(k);
    if (a) a.push(e); else grid.set(k, [e]);
  }
}
function nearCells(x, y, rad) {
  const r = Math.max(1, Math.ceil(((rad || 0) + 40) / 64));
  const cx = Math.floor(x / 64), cy = Math.floor(y / 64);
  const out = [];
  for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) {
    const a = grid.get((cx + i) * 100003 + (cy + j));
    if (a) for (const e of a) out.push(e);
  }
  return out;
}

// =====================================================
//  更新
// =====================================================
function onStageClear() {
  stageCleared = true;
  meta.cleared[stageIdx] = true;
  meta.best[stageIdx] = Math.max(meta.best[stageIdx] || 0, kills);
  saveMeta();
  grim = spawnEnemy('grim');
  banner = { text: '🏆 ステージクリア！', sub: '……しかし、大死神が現れた！ 逃げ切れ！（X キーで脱出）', t: 5 };
  sfxTone(80, 40, 1.0, 'sawtooth', 0.25);
}

function update(dt) {
  T += dt;
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  const v = inputVector();
  if (v.x || v.y) { P.fx = v.x; P.fy = v.y; }
  P.x += v.x * P.speed * dt;
  P.y += v.y * P.speed * dt;
  P.inv = Math.max(0, P.inv - dt);
  P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);

  // 回復の肉：ときどき近くのどこかに落ちている
  foodTimer -= dt;
  if (foodTimer <= 0) {
    foodTimer = FOOD_EVERY[0] + Math.random() * (FOOD_EVERY[1] - FOOD_EVERY[0]);
    foods.push({ x: P.x + (Math.random() - 0.5) * 700, y: P.y + (Math.random() - 0.5) * 500 });
    if (foods.length > FOOD_MAX) foods.shift();
  }
  for (const f of foods) {
    if (Math.hypot(f.x - P.x, f.y - P.y) < 22) {
      f.taken = true;
      P.hp = Math.min(P.maxHp, P.hp + FOOD_HEAL);
      popText(P.x, P.y - 28, '+' + FOOD_HEAL, '#7fff9a');
      sfxTone(500, 900, 0.2, 'triangle', 0.15);
    }
  }
  foods = foods.filter(f => !f.taken);

  updateSpawns(dt);
  if (!stageCleared && T >= S.time) onStageClear();
  buildGrid();
  updateWeapons(dt);
  updateShots(dt);

  // 敵の移動・弾・接触ダメージ
  for (const e of enemies) {
    if (e.dead) continue;
    const d0 = ENEMIES[e.kind];
    e.flash = Math.max(0, e.flash - dt);
    e.orbitCd = Math.max(0, e.orbitCd - dt);
    e.slowT = Math.max(0, e.slowT - dt);
    if (d0.grim) e.speed = Math.min(420, 110 + (T - S.time) * GRIM_ACCEL);   // 大死神はどんどん速くなる
    const dx = P.x - e.x, dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    const spd = e.speed * (e.slowT > 0 ? 0.5 : 1);
    e.x += (dx / d * spd + e.kx) * dt;
    e.y += (dy / d * spd + e.ky) * dt;
    const decay = Math.pow(0.02, dt);
    e.kx *= decay; e.ky *= decay;
    if (d0.shoot && d < 450) {   // 魔人・竜は弾を撃つ
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        e.shootCd = d0.shoot.every;
        for (let i = 0; i < d0.shoot.n; i++) {
          const a = Math.atan2(dy, dx) + (i - (d0.shoot.n - 1) / 2) * 0.3;
          eshots.push({ x: e.x, y: e.y, vx: Math.cos(a) * d0.shoot.speed, vy: Math.sin(a) * d0.shoot.speed, dmg: d0.shoot.dmg * (1 + T / 400) * S.dmg, life: 4, r: 8 });
        }
      }
    }
    if (d > 1500 && !d0.grim) {   // 遠くに離れたら、プレイヤーの近くに出し直す
      const p = ringPos(); e.x = p.x; e.y = p.y;
    }
    if (d < e.r + 12 && P.inv <= 0) {
      P.hp -= e.dmg;
      P.inv = d0.grim ? 0.5 : 0.4;
      sfxTone(160, 70, 0.15, 'square', 0.2);
      popText(P.x, P.y - 24, d0.grim ? '死' : '-' + Math.round(e.dmg), '#ff6a6a');
    }
  }
  enemies = enemies.filter(e => !e.dead);

  for (const b of eshots) {   // 敵の弾
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (Math.hypot(b.x - P.x, b.y - P.y) < b.r + 12) {
      b.life = 0;
      if (P.inv <= 0) { P.hp -= b.dmg; P.inv = 0.3; sfxTone(200, 90, 0.12, 'square', 0.15); popText(P.x, P.y - 24, '-' + Math.round(b.dmg), '#ff6a6a'); }
    }
  }
  eshots = eshots.filter(b => b.life > 0);

  // 宝石：近づくと吸い寄せられ、触れると経験値
  for (const g of gems) {
    const dx = P.x - g.x, dy = P.y - g.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < P.magnet) { g.x += dx / d * 340 * dt; g.y += dy / d * 340 * dt; }
    if (d < 16) { g.taken = true; P.xp += g.v * P.xpMul; sfxPickup(); }
  }
  gems = gems.filter(g => !g.taken);
  while (P.xp >= P.need) { P.xp -= P.need; P.level++; P.need = xpNeed(P.level); pendingLevels++; }

  for (const p of pops) { p.t -= dt; p.y -= 30 * dt; }
  pops = pops.filter(p => p.t > 0);
  for (const f of fxs) f.t -= dt;
  fxs = fxs.filter(f => f.t > 0);

  if (P.hp <= 0) {
    if (P.revives > 0) {   // 復活：HP半分で、周りの敵を吹き飛ばす
      P.revives--;
      P.hp = P.maxHp * 0.5;
      P.inv = 2.5;
      for (const e of enemies) { const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1; if (d < 260) { e.kx += dx / d * 600; e.ky += dy / d * 600; } }
      popText(P.x, P.y - 40, '✨ 復活！', '#ffe27a');
    } else { endGame(); return; }
  }
  if (pendingLevels > 0) { pendingLevels--; showLevelUp(); }
}

// =====================================================
//  レベルアップ
// =====================================================
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildChoices() {
  const out = [];
  // 合体技：材料の武器が両方ともレベルMAXなら、必ず候補に出る
  for (const id in FUSIONS) {
    const f = FUSIONS[id];
    const a = P.weapons.find(w => w.id === f.a), b = P.weapons.find(w => w.id === f.b);
    if (a && b && a.lv >= WEAPONS[f.a].max && b.lv >= WEAPONS[f.b].max && !P.weapons.some(w => w.id === id)) out.push({ kind: 'fusion', id });
  }
  const pool = [];
  for (const id in WEAPONS) {
    if (!weaponUnlocked(id)) continue;
    const w = P.weapons.find(x => x.id === id);
    if (w) { if (w.lv < WEAPONS[id].max) pool.push({ kind: 'weapon', id, lv: w.lv + 1 }); }
    else if (P.weapons.length < MAX_WEAPONS && !P.weapons.some(x => FUSIONS[x.id] && (FUSIONS[x.id].a === id || FUSIONS[x.id].b === id))) pool.push({ kind: 'weapon', id, lv: 1 });
  }
  for (const id in PASSIVES) {
    const lv = P.passives[id] || 0;
    if (lv < PASSIVES[id].max && (lv > 0 || Object.keys(P.passives).length < MAX_PASSIVES)) pool.push({ kind: 'passive', id, lv: lv + 1 });
  }
  const picked = out.concat(shuffle(pool)).slice(0, 3);
  return picked.length ? picked : [{ kind: 'heal' }];
}

function showLevelUp() {
  mode = 'levelup';
  choices = buildChoices();
  luTimer = AUTO_PICK_SECONDS;
  const box = document.getElementById('luCards');
  box.innerHTML = '';
  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'card' + (c.kind === 'fusion' ? ' fusion' : (c.lv === 1 ? ' new' : ''));
    if (c.kind === 'heal') {
      b.innerHTML = '<div class="ic">🍖</div><div class="nm">肉</div><div class="ds">HPを50回復</div>';
    } else if (c.kind === 'fusion') {
      const f = FUSIONS[c.id];
      b.innerHTML = '<div class="ic">' + f.icon + '</div><div class="nm">合体技！ ' + f.name + '</div><div class="ds">' + WEAPONS[f.a].icon + WEAPONS[f.a].name + ' ＋ ' + WEAPONS[f.b].icon + WEAPONS[f.b].name
        + '<br>' + f.desc + '</div>';
    } else {
      const d = c.kind === 'weapon' ? WEAPONS[c.id] : PASSIVES[c.id];
      const maxTag = c.lv >= d.max ? '（MAX）' : '';
      b.innerHTML = '<div class="ic">' + d.icon + '</div><div class="nm">' + d.name + ' Lv' + c.lv + (c.lv === 1 ? '（NEW）' : maxTag)
        + '</div><div class="ds">' + (c.kind === 'weapon' ? d.desc + '<br>' + describe(c.id, c.lv) : d.desc) + '</div>';
    }
    b.addEventListener('click', () => pickChoice(i));
    box.appendChild(b);
  });
  document.getElementById('levelup').classList.add('show');
  sfxLevelUp();
}

function pickChoice(i) {
  const c = choices && choices[i];
  if (!c || mode !== 'levelup') return;
  if (c.kind === 'fusion') {   // 材料の2つを手放して、合体技を手に入れる
    const f = FUSIONS[c.id];
    P.weapons = P.weapons.filter(w => w.id !== f.a && w.id !== f.b);
    P.weapons.push({ id: c.id, lv: 1, cd: 0.2 });
    banner = { text: '✨ 合体技 ' + f.name, sub: f.desc, t: 3 };
  } else if (c.kind === 'weapon') {
    const w = P.weapons.find(x => x.id === c.id);
    if (w) w.lv = c.lv; else P.weapons.push({ id: c.id, lv: 1, cd: 0.2 });
  } else if (c.kind === 'passive') {
    P.passives[c.id] = c.lv;
  } else {
    P.hp = Math.min(P.maxHp, P.hp + 50);
  }
  recompute();
  document.getElementById('levelup').classList.remove('show');
  mode = 'play';
  choices = null;
}

window.addEventListener('keydown', e => {
  if (mode === 'levelup' && choices && e.key >= '1' && e.key <= String(choices.length)) pickChoice(Number(e.key) - 1);
});

// =====================================================
//  終了・メニュー・ショップ
// =====================================================
function fmtTime(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }

function endGame() {
  mode = 'end';
  // コイン：倒した数と生き残った時間、クリアのボーナス
  const coins = Math.floor(kills * 0.5 + T / 6) + (stageCleared ? 300 + stageIdx * 150 : 0);
  meta.coins += coins;
  saveMeta();
  document.getElementById('endTitle').textContent = stageCleared ? '🏆 ステージクリア！' : '💀 力尽きた…';
  document.getElementById('endBody').textContent =
    S.name + '\n生存時間 ' + fmtTime(T) + ' ／ 倒した敵 ' + kills + ' 体 ／ レベル ' + P.level
    + '\n武器：' + P.weapons.map(w => wdef(w.id).icon + (FUSIONS[w.id] ? '★' : 'Lv' + w.lv)).join(' ')
    + '\n獲得コイン 💰 +' + coins + '（所持 ' + meta.coins + '）'
    + (stageCleared && stageIdx + 1 < STAGES.length ? '\n次のステージ「' + STAGES[stageIdx + 1].name + '」が解放されました' : '');
  document.getElementById('endview').classList.add('show');
}

document.getElementById('endBtn').addEventListener('click', () => {
  document.getElementById('endview').classList.remove('show');
  mode = 'menu';
  showMenu();
});

const stageUnlocked = i => i === 0 || !!meta.cleared[i - 1];

function showMenu() {
  document.getElementById('coins').textContent = '💰 コイン ' + meta.coins;
  const chBox = document.getElementById('chars');
  chBox.innerHTML = '';
  CHARACTERS.forEach((ch, i) => {
    const b = document.createElement('button');
    b.className = 'card' + (sel.ch === i ? ' sel' : '');
    b.innerHTML = '<div class="ic">' + ch.icon + '</div><div class="nm">' + ch.name + '</div><div class="ds">HP ' + ch.hp + ' ／ 速さ ' + ch.speed
      + '<br>' + ch.desc.replace('\n', '<br>') + '</div>';
    b.addEventListener('click', () => { sel.ch = i; showMenu(); });
    chBox.appendChild(b);
  });
  const stBox = document.getElementById('stages');
  stBox.innerHTML = '';
  STAGES.forEach((st, i) => {
    const ok = stageUnlocked(i);
    const b = document.createElement('button');
    b.className = 'card' + (sel.stage === i ? ' sel' : '') + (ok ? '' : ' lock');
    b.innerHTML = '<div class="ic">' + (ok ? (meta.cleared[i] ? '🏆' : '🗺️') : '🔒') + '</div><div class="nm">' + (i + 1) + '. ' + st.name + '</div><div class="ds">'
      + (ok ? '目標 ' + fmtTime(st.time) + '<br>敵の強さ ×' + st.hp + (meta.cleared[i] ? '<br>クリア済み（最高撃破 ' + (meta.best[i] || 0) + '）' : '') : '前のステージをクリアすると解放') + '</div>';
    b.addEventListener('click', () => { if (ok) { sel.stage = i; showMenu(); } });
    stBox.appendChild(b);
  });
  document.getElementById('menu').classList.add('show');
}

document.getElementById('goBtn').addEventListener('click', () => {
  if (!stageUnlocked(sel.stage)) sel.stage = 0;
  initAudio();
  startGame(CHARACTERS[sel.ch], sel.stage);
});
document.getElementById('shopBtn').addEventListener('click', () => { document.getElementById('menu').classList.remove('show'); showShop(); });
document.getElementById('shopClose').addEventListener('click', () => { document.getElementById('shop').classList.remove('show'); showMenu(); });

function showShop() {
  document.getElementById('shopCoins').textContent = '💰 コイン ' + meta.coins + '\nコインは、プレイ後に増えます。ここで買った強化は、ずっと続きます。';
  const box = document.getElementById('shopItems');
  box.innerHTML = '';
  const add = (icon, name, desc, lvText, cost, can, onBuy) => {
    const b = document.createElement('button');
    b.className = 'card' + (can ? '' : ' poor') + (cost === null ? ' lock' : '');
    b.innerHTML = '<div class="ic">' + icon + '</div><div class="nm">' + name + '</div><div class="ds">' + desc + '<br>' + lvText
      + '<br><b>' + (cost === null ? 'MAX' : '💰 ' + cost) + '</b></div>';
    b.addEventListener('click', () => { if (cost !== null && meta.coins >= cost) { meta.coins -= cost; onBuy(); saveMeta(); showShop(); } });
    box.appendChild(b);
  };
  for (const it of SHOP) {
    const lv = mlv(it.id);
    const cost = lv >= it.max ? null : it.cost(lv);
    add(it.icon, it.name, it.desc, 'Lv ' + lv + ' / ' + it.max, cost, cost !== null && meta.coins >= cost, () => { meta.lv[it.id] = lv + 1; });
  }
  for (const id in WEAPONS) {   // 武器の解放
    const w = WEAPONS[id];
    if (!w.locked) continue;
    const owned = !!meta.weapons[id];
    add(w.icon, '武器解放：' + w.name, w.desc, owned ? '解放済み' : '未解放', owned ? null : w.cost, !owned && meta.coins >= w.cost, () => { meta.weapons[id] = true; });
  }
  document.getElementById('shop').classList.add('show');
}

// =====================================================
//  音（WebAudio で作る。外部ファイル不要）。M キーで ON/OFF
// =====================================================
let ac = null, soundOn = true, mStep = 0, mNext = 0;
const lastSfx = {};
function initAudio() {
  if (ac || typeof AudioContext === 'undefined') return;
  ac = new AudioContext();
  mNext = ac.currentTime + 0.1;
  setInterval(musicTick, 50);
}
function toggleSound() { soundOn = !soundOn; if (ac && soundOn && ac.state === 'suspended') ac.resume(); }
function sfxTone(f0, f1, dur, type, vol) {
  if (!ac || !soundOn) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function throttled(key, gap) {
  const t = ac ? ac.currentTime : 0;
  if (lastSfx[key] !== undefined && t - lastSfx[key] < gap) return false;
  lastSfx[key] = t;
  return true;
}
function sfxHit() { if (throttled('hit', 0.05)) sfxTone(300, 120, 0.06, 'square', 0.06); }
function sfxPickup() { if (throttled('pick', 0.05)) sfxTone(900, 1400, 0.05, 'sine', 0.05); }
function sfxLevelUp() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfxTone(f, f, 0.18, 'triangle', 0.15), i * 90)); }

// BGM：短いコード進行の繰り返し。時間が進むほど速くなり、大死神が出ると一気に速く不穏になる
const CHORDS = [[45, 57, 60, 64], [41, 53, 57, 60], [43, 55, 59, 62], [40, 52, 55, 59]];
const CHORDS_GRIM = [[45, 57, 60, 64], [43, 55, 59, 62], [41, 53, 57, 60], [40, 52, 56, 59]];
function hz(n) { return 440 * Math.pow(2, (n - 69) / 12); }
function musicTick() {
  if (!ac || !soundOn || mode === 'menu') return;
  while (mNext < ac.currentTime + 0.3) {
    const finale = typeof stageCleared !== 'undefined' && stageCleared;
    const step = 60 / (110 + Math.min(T || 0, 300) / 5 + (finale ? 40 : 0)) / 2;
    const ch = (finale ? CHORDS_GRIM : CHORDS)[Math.floor(mStep / 8) % 4], i = mStep % 8;
    const t = mNext;
    const note = (f, dur, type, vol) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
    };
    if (i % 2 === 0) note(hz(ch[0]), step * 1.8, 'triangle', 0.06);
    note(hz(ch[1 + [0, 1, 2, 1, 2, 1, 0, 1][i]] + 12), step * 0.9, finale ? 'sawtooth' : 'square', 0.015);
    mNext += step;
    mStep++;
  }
}

// =====================================================
//  描画
// =====================================================
function icon(key, emoji, x, y, size) {
  const img = iconImage(key);
  if (img) { ctx.drawImage(img, x - size / 2, y - size / 2, size, size); return; }
  ctx.font = Math.round(size) + 'px sans-serif';
  ctx.fillText(emoji, x, y + size * 0.34);
}

function gemStyle(v) {   // 宝石の色と大きさ：強い敵の宝石ほど、色が変わって大きい
  if (v >= 100) return { c: '#c07aff', s: 9 };
  if (v >= 25) return { c: '#ff6a6a', s: 8 };
  if (v >= 5) return { c: '#7fe08a', s: 6.5 };
  return { c: '#6ab8ff', s: 5.5 };
}

function draw() {
  ctx.clearRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  if (!P || mode === 'menu') { ctx.fillStyle = '#1b2a22'; ctx.fillRect(0, 0, VW, VH); return; }
  const cx = P.x - VW / 2, cy = P.y - VH / 2;   // カメラ
  ctx.save();
  ctx.translate(-cx, -cy);

  // 背景（ステージごとの色と飾り）
  const x0 = Math.floor(cx / 64) - 1, y0 = Math.floor(cy / 64) - 1;
  for (let gx = x0; gx <= x0 + VW / 64 + 2; gx++) {
    for (let gy = y0; gy <= y0 + VH / 64 + 2; gy++) {
      ctx.fillStyle = S.bg[(gx + gy) & 1];
      ctx.fillRect(gx * 64, gy * 64, 64, 64);
      const h = ((gx * 73856093) ^ (gy * 19349663)) >>> 0;
      if (h % 100 < 8) { ctx.globalAlpha = 0.5; ctx.font = '18px sans-serif'; ctx.fillText(S.deco[(h >> 8) % S.deco.length], gx * 64 + 32, gy * 64 + 38); ctx.globalAlpha = 1; }
    }
  }

  // 肉
  for (const f of foods) icon('item:food', '🍖', f.x, f.y + Math.sin(T * 4) * 3, 26);
  // 宝石
  for (const g of gems) {
    const st = gemStyle(g.v);
    ctx.fillStyle = st.c;
    ctx.beginPath(); ctx.moveTo(g.x, g.y - st.s - 1); ctx.lineTo(g.x + st.s - 1, g.y); ctx.lineTo(g.x, g.y + st.s + 1); ctx.lineTo(g.x - st.s + 1, g.y); ctx.closePath(); ctx.fill();
  }

  // 敵
  for (const e of enemies) {
    const d = ENEMIES[e.kind];
    if (e.x < cx - 80 || e.x > cx + VW + 80 || e.y < cy - 80 || e.y > cy + VH + 80) continue;
    if (d.grim) { ctx.strokeStyle = 'rgba(255,40,40,0.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 6 + Math.sin(T * 6) * 3, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1; }
    if (e.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 2, 0, Math.PI * 2); ctx.fill(); }
    if (e.slowT > 0) { ctx.fillStyle = 'rgba(120,200,255,0.35)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 3, 0, Math.PI * 2); ctx.fill(); }
    icon('enemy:' + e.kind, d.icon, e.x, e.y + Math.sin(T * 8 + e.id * 9) * 1.5, e.r * 2.2);
    if ((d.elite || d.boss) && !d.grim) {
      ctx.fillStyle = '#222'; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2, 4);
      ctx.fillStyle = '#e0605a'; ctx.fillRect(e.x - e.r, e.y - e.r - 8, e.r * 2 * Math.max(0, e.hp / e.maxHp), 4);
    }
  }
  for (const b of eshots) { ctx.fillStyle = 'rgba(255,120,60,0.9)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r / 2, 0, Math.PI * 2); ctx.fill(); }

  // 周りを回る光
  for (const w of P.weapons) if ((w.id === 'orbit' || w.id === 'sanctuary') && w.orbs) for (const o of w.orbs) {
    ctx.fillStyle = 'rgba(255,240,150,0.9)'; ctx.beginPath(); ctx.arc(o.x, o.y, 11, 0, Math.PI * 2); ctx.fill(); icon('weapon:orbit', '📖', o.x, o.y, 20);
  }

  // 弾
  for (const p of shots) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
    icon('weapon:' + p.wid, p.icon, 0, 0, p.r * 2.4);
    ctx.restore();
  }

  // プレイヤー
  if (!(P.inv > 0 && Math.floor(T * 20) % 2)) icon('char:' + P.ch.id, P.ch.icon, P.x, P.y + Math.sin(T * 10) * 1.5, 38);
  ctx.fillStyle = '#222'; ctx.fillRect(P.x - 20, P.y + 22, 40, 5);
  ctx.fillStyle = '#7fd36b'; ctx.fillRect(P.x - 20, P.y + 22, 40 * Math.max(0, P.hp / P.maxHp), 5);

  // 演出
  for (const f of fxs) {
    if (f.kind === 'ring') { ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1; }
    if (f.kind === 'bolt') {
      ctx.strokeStyle = f.color || '#fff27a'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(f.x - 10, f.y - VH / 2); ctx.lineTo(f.x + 8, f.y - VH / 4); ctx.lineTo(f.x - 6, f.y - 30); ctx.lineTo(f.x, f.y); ctx.stroke(); ctx.lineWidth = 1;
    }
    if (f.kind === 'link') { ctx.strokeStyle = '#9fe0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke(); ctx.lineWidth = 1; }
  }
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.color; ctx.font = 'bold 14px sans-serif'; ctx.fillText(p.text, p.x, p.y); ctx.globalAlpha = 1; }
  ctx.restore();

  // ドラッグ操作の目印
  if (joy.active) { ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 40, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(joy.x, joy.y, 16, 0, Math.PI * 2); ctx.fill(); }

  // 大死神が近いときの画面の赤み
  if (grim && !grim.dead) {
    const d = Math.hypot(grim.x - P.x, grim.y - P.y);
    ctx.fillStyle = 'rgba(160,0,0,' + Math.max(0, Math.min(0.35, (500 - d) / 1400)) + ')'; ctx.fillRect(0, 0, VW, VH);
  }

  // 画面上の表示：経験値バー・時間・レベル・武器
  ctx.fillStyle = '#0c1214'; ctx.fillRect(0, 0, VW, 14);
  ctx.fillStyle = '#6ab8ff'; ctx.fillRect(0, 0, VW * Math.min(1, P.xp / P.need), 14);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Lv ' + P.level, 6, 11);
  ctx.textAlign = 'center'; ctx.font = 'bold 26px sans-serif';
  ctx.fillStyle = stageCleared ? '#ff6a6a' : '#fff';
  ctx.fillText(fmtTime(T), VW / 2, 44);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(stageCleared ? '⚠ 大死神から逃げろ！ X で脱出' : S.name + '　クリアまで ' + fmtTime(Math.max(0, S.time - T)), VW / 2, 60);
  ctx.textAlign = 'right'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('💀 ' + kills, VW - 10, 34);
  ctx.textAlign = 'left'; ctx.font = '15px sans-serif';
  let ix = 8;
  for (const w of P.weapons) { ctx.fillText(wdef(w.id).icon + (FUSIONS[w.id] ? '★' : (w.lv >= WEAPONS[w.id].max ? 'M' : w.lv)), ix, 34); ix += 44; }
  ix = 8;
  for (const id in P.passives) { ctx.fillText(PASSIVES[id].icon + P.passives[id], ix, 54); ix += 44; }
  ctx.textAlign = 'center';
  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.t);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, VH * 0.3 - 36, VW, 90);
    ctx.fillStyle = '#ffd75e'; ctx.font = 'bold 32px sans-serif'; ctx.fillText(banner.text, VW / 2, VH * 0.3 + 6);
    ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.fillText(banner.sub || '', VW / 2, VH * 0.3 + 36);
    ctx.globalAlpha = 1;
  }
}

// =====================================================
//  メインループ
// =====================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (mode === 'play') update(dt);
  if (mode === 'levelup' && AUTO_PICK_SECONDS > 0) {   // 選ばないと、制限時間でランダムに選ばれる
    luTimer -= dt;
    document.getElementById('luTitle').textContent = 'LEVEL UP！（' + Math.max(0, Math.ceil(luTimer)) + '秒で自動選択）';
    if (luTimer <= 0) pickChoice(Math.floor(Math.random() * choices.length));
  }
  draw();
  requestAnimationFrame(loop);
}

showMenu();
requestAnimationFrame(loop);
</script>
